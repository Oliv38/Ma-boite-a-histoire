name: App Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["index.html", "audio/**", "illus/**", "app/**", ".github/workflows/android.yml"]

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Contenu embarqué (page, voix, illustrations)
        run: bash build_www.sh
      - name: Capacitor
        run: |
          npm install --no-audit --no-fund @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest
          npx cap add android
          npx cap sync android
      - name: Icône de l'application
        continue-on-error: true
        run: npx --yes @capacitor/assets@latest generate --android --iconBackgroundColor "#141a3a" --iconBackgroundColorDark "#141a3a" --splashBackgroundColor "#141a3a" --splashBackgroundColorDark "#090c22"
      - name: Compilation de l'APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          mkdir -p ../../dist
          cp app/build/outputs/apk/debug/app-debug.apk ../../dist/ma-boite-a-histoires.apk
          ls -la ../../dist
      - uses: actions/upload-artifact@v4
        with:
          name: ma-boite-a-histoires-apk
          path: dist/ma-boite-a-histoires.apk
      - name: Publication (téléchargement direct)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Ma boîte à histoires — Android
          body: "APK à installer directement sur un téléphone Android (autoriser l'installation depuis cette source). Généré automatiquement depuis le commit ${{ github.sha }}."
          prerelease: true
          make_latest: false
          files: dist/ma-boite-a-histoires.apk
